<div class="confirm-card" role="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
  <div class="card-top-icon" aria-hidden="true">
  </div>

  <h2 id="confirm-title" class="confirm-title">{{ data.title }}</h2>

  <p id="confirm-msg" class="confirm-message">
    {{ data.message }}
  </p>

  <div class="confirm-actions">
    <button mat-raised-button color (click)="onCancel()">
  No,Keep It
</button>

<button mat-raised-button color="warn" (click)="onConfirm()">
  Yes,Cancel Reservation
</button>
  </div>
</div>
