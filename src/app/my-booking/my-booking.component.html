<div class="container">
<div *ngIf="loading">Loading bookings…</div>
<div *ngIf="errorMsg" class="error">{{ errorMsg }}</div>

    <table class="booking-table booking-table-bordered booking-table-hover booking-table-striped" *ngIf="!loading && bookings.length">

        <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Room</th>
                <th>Date</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Type</th>
                <th>Recurring option</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let booking of bookings; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ booking.description }}</td>
                <td>{{ booking.room || booking.roomName }}</td>
                <td>{{ booking.date }}</td>
                <td>{{ booking.startTime }}</td>
                <td>{{ booking.endTime }}</td>
                <td>{{ booking.type }}</td>
                <td>{{ booking.recurrenceOption }}</td>
                <td><button class="edit-btn" (click)="onModify(booking.id)"><i class="fas fa-edit"></i></button></td>   
                <td><button class="delete-btn"><i class="fa-solid fa-trash"></i></button></td>
            </tr>
        </tbody>

    </table>

</div>
